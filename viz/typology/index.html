<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Atlas de Tipologías land2vec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #f6f7f3;
    --surface: #ffffff;
    --surface-2: #eef0e9;
    --ink: #1b2016;
    --muted: #626c58;
    --faint: #8a9179;
    --border: #e0e4d7;
    --accent: #40682f;
    --accent-ink: #ffffff;
    --shadow: 0 1px 2px rgba(27, 32, 22, .06), 0 8px 24px rgba(27, 32, 22, .08);
    --chart-grid: #ecefe6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12140e;
      --surface: #1b1e16;
      --surface-2: #23271d;
      --ink: #e9ece1;
      --muted: #9aa489;
      --faint: #6f7a5e;
      --border: #333a2a;
      --accent: #8fb96e;
      --accent-ink: #14170f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .38);
      --chart-grid: #2b3121;
    }
  }
  :root[data-theme="dark"] {
    --ground: #12140e;
    --surface: #1b1e16;
    --surface-2: #23271d;
    --ink: #e9ece1;
    --muted: #9aa489;
    --faint: #6f7a5e;
    --border: #333a2a;
    --accent: #8fb96e;
    --accent-ink: #14170f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .38);
    --chart-grid: #2b3121;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  h1, h2, h3 { font-family: "Spectral", Georgia, serif; font-weight: 600; margin: 0; text-wrap: balance; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  /* ---- header ---- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 22px;
  }
  .head-row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 20px; letter-spacing: .1px; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  .head-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .filebtn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 7px; padding: 7px 13px; font-weight: 600; font-size: 12.5px;
  }
  .filebtn input { display: none; }
  .ghost {
    background: transparent; border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 10px; font-size: 12.5px; color: var(--muted);
  }
  .banner {
    margin-top: 10px; font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.live { background: var(--accent); }

  /* ---- run chips ---- */
  .runbar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .runchip {
    display: flex; flex-direction: column; gap: 2px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; padding: 8px 12px; min-width: 132px; text-align: left;
    transition: border-color .12s, transform .12s;
  }
  .runchip:hover { border-color: var(--faint); }
  .runchip[aria-pressed="true"] {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .runchip .rn { font-family: "Spectral", serif; font-size: 13.5px; font-weight: 600; }
  .runchip .rk { font-size: 11px; color: var(--muted); }
  .runchip .rk b { color: var(--ink); font-weight: 600; }

  /* ---- layout ---- */
  main { padding: 20px 22px 40px; max-width: 1500px; margin: 0 auto; }
  .runmeta {
    display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline;
    padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .runmeta h2 { font-size: 17px; }
  .runmeta .m { font-size: 12px; color: var(--muted); }
  .runmeta .m b { color: var(--ink); font-weight: 600; font-family: "IBM Plex Mono", monospace; }
  .verdict {
    font-size: 12px; color: var(--muted); max-width: 62ch;
    border-left: 2px solid var(--border); padding-left: 12px;
  }

  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
    padding: 13px 13px 11px; text-align: left; display: flex; flex-direction: column; gap: 9px;
    transition: border-color .12s, box-shadow .12s, transform .12s;
  }
  .card:hover { border-color: var(--faint); box-shadow: var(--shadow); transform: translateY(-1px); }
  .card .lab { font-family: "Spectral", serif; font-size: 14px; font-weight: 600; line-height: 1.28; }
  .card .cid { color: var(--faint); font-weight: 500; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
  .card .gloss { font-size: 11.5px; color: var(--muted); }
  .sharebar { height: 4px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .sharebar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .card .foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .card .foot .mono { color: var(--ink); }

  /* ---- chronogram svg ---- */
  .chrono { width: 100%; display: block; border-radius: 5px; background: var(--chart-grid); }
  .axis text { fill: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 9px; }
  .axis line { stroke: var(--border); }

  /* ---- drawer ---- */
  .scrim {
    position: fixed; inset: 0; background: rgba(20, 24, 16, .34);
    opacity: 0; pointer-events: none; transition: opacity .16s; z-index: 40;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(468px, 94vw);
    background: var(--surface); border-left: 1px solid var(--border);
    box-shadow: var(--shadow); z-index: 50;
    transform: translateX(100%); transition: transform .2s cubic-bezier(.4, 0, .2, 1);
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: none; }
  .drawer .dhead {
    padding: 18px 20px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .drawer .dhead h3 { font-size: 16px; line-height: 1.3; }
  .drawer .dhead .cid { color: var(--faint); font-size: 11px; font-family: "IBM Plex Mono", monospace; }
  .drawer .close { margin-left: auto; background: var(--surface-2); border: 0; border-radius: 6px; width: 28px; height: 28px; flex: none; color: var(--muted); }
  .dbody { padding: 16px 20px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
  .sect > .sh {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--faint); margin-bottom: 7px;
  }
  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .statgrid div { background: var(--surface); padding: 8px 10px; }
  .statgrid .k { font-size: 10.5px; color: var(--muted); }
  .statgrid .v { font-family: "IBM Plex Mono", monospace; font-size: 13px; }
  .strip { display: flex; width: 100%; height: 20px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
  .strip i { flex: 1; }
  .striplab { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 3px; }
  .seqrow { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 11px; }
  .seqrow .cov { width: 34px; text-align: right; color: var(--muted); font-family: "IBM Plex Mono", monospace; }
  .seqrow .bar { flex: none; width: 46px; height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .seqrow .bar i { display: block; height: 100%; background: var(--faint); }
  .seqrow .txt { font-family: "IBM Plex Mono", monospace; overflow-x: auto; white-space: nowrap; color: var(--ink); }
  .zbars i { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--muted); }
  .legend b { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .vecino { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--muted); overflow-x: auto; white-space: nowrap; padding: 2px 0; }

  @media (max-width: 620px) {
    .runmeta { gap: 12px; }
    main { padding: 16px 14px 40px; }
    header { padding: 12px 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1>Atlas de Tipologías</h1>
    <span class="sub">land2vec v2 · trayectorias de uso del suelo 2000&ndash;2022 · 7 zonas out-of-domain</span>
    <div class="head-tools">
      <label class="filebtn">
        cargar JSON
        <input type="file" id="file" accept="application/json,.json">
      </label>
      <button class="ghost" id="themeBtn" title="Cambiar tema">tema</button>
    </div>
  </div>
  <div class="banner"><span class="dot" id="statusDot"></span><span id="statusText">datos de ejemplo &mdash; servido por HTTP toma <span class="mono">typology_browser.json</span> solo; con <span class="mono">file://</span> usá &laquo;cargar JSON&raquo; (lo genera <span class="mono">scripts/describe_clusters.py</span>)</span></div>
  <div class="runbar" id="runbar"></div>
</header>

<main>
  <div class="runmeta" id="runmeta"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dhead">
    <div>
      <h3 id="dTitle">&mdash;</h3>
      <span class="cid" id="dCid"></span>
    </div>
    <button class="close" id="dClose" aria-label="Cerrar">&times;</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

<script>
  "use strict";

  // Vocabulario en orden de id de token (land2vec.tokenizer.Tokenizer.VOCAB).
  const VOCAB = ["[UNK]", "A", "F", "G", "Wt", "U", "Sh", "Sp", "B", "Wa", "Nd"];
  const FALLBACK_COLORS = {
    "[UNK]": "#d9d9d9", "A": "#e6c229", "F": "#1b7837", "G": "#a6d96a", "Wt": "#2b8cbe",
    "U": "#d7301f", "Sh": "#b8860b", "Sp": "#dfc27d", "B": "#8c6d31", "Wa": "#08519c", "Nd": "#bdbdbd"
  };
  const STATE_LABEL = {
    "A": "agricultura", "F": "forestal", "G": "pastizal", "Wt": "humedal", "U": "urbano",
    "Sh": "arbustal", "Sp": "esparso", "B": "suelo desnudo", "Wa": "agua", "Nd": "sin dato", "[UNK]": "relleno"
  };

  let DATA = sampleData();
  let colors = { ...FALLBACK_COLORS };
  let year0 = 2000;
  let activeRun = 0;

  const $ = (s) => document.querySelector(s);

  /* ---------- carga ---------- */
  function applyData(parsed, source) {
    if (!parsed.runs || !Array.isArray(parsed.runs)) throw new Error("sin campo 'runs'");
    DATA = parsed;
    colors = { ...FALLBACK_COLORS, ...(parsed.state_colors || {}) };
    year0 = parsed.year_0 || 2000;
    activeRun = 0;
    const nCl = DATA.runs.reduce((a, r) => a + r.clusters.length, 0);
    $("#statusDot").className = "dot live";
    $("#statusText").innerHTML = `<span class="mono">${esc(source)}</span> &middot; ${DATA.runs.length} corridas &middot; ${nCl} clusters`;
    render();
  }

  $("#file").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { applyData(JSON.parse(r.result), f.name); }
      catch (err) { $("#statusText").textContent = "no pude leer el archivo: " + err.message; }
    };
    r.readAsText(f);
  });

  // Al abrir servido por HTTP (GitHub Pages, o `python -m http.server`), toma el
  // JSON de al lado automáticamente. Con file:// el fetch falla en silencio y
  // queda la muestra de ejemplo + el botón "cargar JSON".
  fetch("./typology_browser.json")
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
    .then((j) => applyData(j, "typology_browser.json"))
    .catch(() => {});

  /* ---------- tema ---------- */
  $("#themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? "dark"
      : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", next);
  });

  /* ---------- render principal ---------- */
  function render() {
    const rb = $("#runbar");
    rb.innerHTML = "";
    DATA.runs.forEach((run, i) => {
      const b = document.createElement("button");
      b.className = "runchip";
      b.setAttribute("aria-pressed", i === activeRun);
      b.innerHTML = `<span class="rn">${esc(run.name)}</span>
        <span class="rk">k=<b>${run.k}</b> &middot; ${esc(run.algo)} ${esc(run.space || "")}</span>
        <span class="rk">ruido <b>${pct(run.noise_frac)}</b></span>`;
      b.onclick = () => { activeRun = i; render(); };
      rb.appendChild(b);
    });
    renderRun(DATA.runs[activeRun]);
  }

  function renderRun(run) {
    const m = run.metrics || {};
    const sd = run.seqdist || {};
    $("#runmeta").innerHTML = `
      <h2>${esc(run.name)}</h2>
      <span class="m">algoritmo <b>${esc(run.algo)}</b></span>
      <span class="m">espacio <b>${esc(run.space || "—")}</b></span>
      <span class="m">k <b>${run.k}</b></span>
      <span class="m">silhouette (z) <b>${num(m.silhouette_mean)}</b></span>
      <span class="m">estabilidad <b>${num(m.stability_ari)}</b></span>
      <span class="m">fidelidad prototipo <b>${num(m.prototype_fidelity)}</b></span>
      <span class="m">pseudo-R² (${esc(sd.metodo || "seq")}) <b>${num(sd.pseudo_r2)}</b></span>
      <span class="m">ASW secuencias <b>${num(sd.asw_secuencias)}</b></span>
      <span class="m">ruido <b>${pct(run.noise_frac)}</b></span>
      <p class="verdict">Cobertura media de la secuencia distinta más frecuente por cluster:
        <b class="mono">${num(run.top1_coverage_weighted)}</b>.
        Cerca de 1 &rarr; la partición es una tabla de patrones frecuentes más que una tipología.
        pseudo-R² mide cuánta de la variación real de trayectoria (disimilitud entre secuencias,
        ajena al espacio <span class="mono">z</span>) explica la partición.</p>`;

    const g = $("#grid");
    g.innerHTML = "";
    const maxShare = Math.max(...run.clusters.map((c) => c.share || 0), 0.01);
    run.clusters.slice().sort((a, b) => b.n - a.n).forEach((c) => {
      const chrono = c.chronogram || synthChrono(c.modal_seq);
      const card = document.createElement("button");
      card.className = "card";
      card.innerHTML = `
        <div><span class="lab">${esc(labelHead(c.etiqueta))}</span></div>
        <div class="gloss">${esc(c.glosa || "")}${c.anio_cambio ? " · ~" + c.anio_cambio : ""}</div>
        ${chronoSVG(chrono, 232, 66, false)}
        <div class="sharebar"><i style="width:${(100 * (c.share || 0) / maxShare).toFixed(1)}%"></i></div>
        <div class="foot"><span class="cid">#${c.cluster}</span>
          <span><span class="mono">${fmtInt(c.n)}</span> · ${pct(c.share)}</span></div>`;
      card.onclick = () => openDrawer(run, c, chrono);
      g.appendChild(card);
    });
  }

  /* ---------- chronograma SVG (estilo seqdplot) ---------- */
  function chronoSVG(rows, w, h, axis) {
    const T = rows.length;
    const padB = axis ? 16 : 0, padL = axis ? 26 : 0;
    const cw = (w - padL) / T, ch = h - padB;
    let bars = "";
    for (let t = 0; t < T; t++) {
      let acc = 0;
      const col = rows[t];
      for (let s = 0; s < col.length; s++) {
        const p = col[s];
        if (p <= 0.0001) { continue; }
        const y = ch - (acc + p) * ch;
        bars += `<rect x="${(padL + t * cw).toFixed(2)}" y="${y.toFixed(2)}" width="${cw + 0.5}" height="${(p * ch).toFixed(2)}" fill="${colors[VOCAB[s]] || "#ccc"}"/>`;
        acc += p;
      }
    }
    let ax = "";
    if (axis) {
      ax = `<g class="axis">`;
      for (let yr = 0; yr < T; yr += 5) {
        ax += `<text x="${(padL + yr * cw).toFixed(1)}" y="${h - 4}">${year0 + yr}</text>`;
      }
      ax += `<text x="${padL + (T - 1) * cw}" y="${h - 4}" text-anchor="end">${year0 + T - 1}</text>`;
      ax += `<text x="0" y="10">1.0</text><text x="0" y="${ch}">0</text>`;
      ax += `<line x1="${padL}" y1="0" x2="${padL}" y2="${ch}"/></g>`;
    }
    return `<svg class="chrono" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="cronograma de estados por año">${bars}${ax}</svg>`;
  }

  function tokenStrip(seqStr) {
    if (!seqStr) return `<div class="strip"></div>`;
    const toks = seqStr.split("-");
    return `<div class="strip">${toks.map((t) => `<i style="background:${colors[t] || "#ccc"}" title="${year0}+ ${t}"></i>`).join("")}</div>`;
  }

  /* ---------- drawer ---------- */
  function openDrawer(run, c, chrono) {
    $("#dTitle").textContent = c.etiqueta || "cluster " + c.cluster;
    $("#dCid").textContent = `${run.name} · #${c.cluster} · n=${fmtInt(c.n)} · ${pct(c.share)} de la corrida`;
    let cum = 0;
    const top80 = (c.top_seqs_80 || c.top_seqs || []).map((s) => {
      cum += s.coverage;
      return `<div class="seqrow">
        <span class="cov">${pct(s.coverage)}</span>
        <span class="bar" title="acumulado ${pct(cum)}"><i style="width:${(100 * Math.min(cum, 1)).toFixed(0)}%"></i></span>
        <span class="txt">${esc(s.text)}</span>
      </div>`;
    }).join("");
    const reps = (c.representantes || []).map((s) => `
      <div class="seqrow">
        <span class="cov">${pct(s.covered)}</span>
        ${tokenStrip(s.text)}
      </div>`).join("");
    const vec = (c.vecinos || []).map((v) => `<div class="vecino">${esc(v)}</div>`).join("");

    $("#dBody").innerHTML = `
      <div class="sect">
        <div class="sh">cronograma &mdash; proporción de estados por año</div>
        ${chronoSVG(chrono, 424, 150, true)}
        ${legend(chrono)}
      </div>
      <div class="sect">
        <div class="sh">secuencia modal vs. prototipo decodificado</div>
        ${tokenStrip(c.modal_seq)}
        <div class="striplab"><span>modal (libre de modelo)</span><span>${year0}&ndash;${year0 + 22}</span></div>
        ${tokenStrip(c.proto_seq)}
        <div class="striplab"><span>prototipo (decoder del autoencoder)</span><span>coincidencia ${pct(c.modal_vs_proto)}</span></div>
      </div>
      <div class="sect">
        <div class="sh">índices</div>
        <div class="statgrid">
          <div><div class="k">forma</div><div class="v">${esc(c.forma || "—")}</div></div>
          <div><div class="k">año del cambio</div><div class="v">${c.anio_cambio || "—"}</div></div>
          <div><div class="k">transiciones (media)</div><div class="v">${num(c.n_transiciones_medio)}</div></div>
          <div><div class="k">índice complejidad</div><div class="v">${num(c.indice_complejidad_medio)}</div></div>
          <div><div class="k">Hamming media intra</div><div class="v">${num(c.hamming_media_intra)}</div></div>
          <div><div class="k">entropía transv. pico</div><div class="v">${num(c.entropia_transv_pico)}</div></div>
          <div><div class="k">cobertura top-1 / top-5</div><div class="v">${pct(c.cobertura_top1)} / ${pct(c.cobertura_top5)}</div></div>
          <div><div class="k">ASW · cobertura repres.</div><div class="v">${num(c.asw)} · ${pct(c.rep_coverage)}</div></div>
          <div><div class="k">zona dominante</div><div class="v" style="font-size:11px">${esc(c.zona_dominante || "—")} ${c.zona_dominante_share ? pct(c.zona_dominante_share) : ""}</div></div>
        </div>
      </div>
      ${top80 ? `<div class="sect"><div class="sh">trayectorias más frecuentes &mdash; hasta ${pct(c.cobertura_acumulada_80 || 0.8)} del cluster</div>${top80}</div>` : ""}
      ${reps ? `<div class="sect"><div class="sh">secuencias representativas (seqrplot · radio 10%)</div>${reps}</div>` : ""}
      ${vec ? `<div class="sect"><div class="sh">vecinos reales del centroide (z)</div>${vec}</div>` : ""}`;

    $("#scrim").classList.add("open");
    $("#drawer").classList.add("open");
    $("#drawer").setAttribute("aria-hidden", "false");
  }
  function closeDrawer() {
    $("#scrim").classList.remove("open");
    $("#drawer").classList.remove("open");
    $("#drawer").setAttribute("aria-hidden", "true");
  }
  $("#scrim").addEventListener("click", closeDrawer);
  $("#dClose").addEventListener("click", closeDrawer);
  addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

  function legend(chrono) {
    const seen = new Set();
    chrono.forEach((col) => col.forEach((p, s) => { if (p > 0.02) seen.add(s); }));
    return `<div class="legend">${[...seen].sort((a, b) => a - b).map((s) =>
      `<span><b style="background:${colors[VOCAB[s]]}"></b>${VOCAB[s]} · ${STATE_LABEL[VOCAB[s]] || ""}</span>`).join("")}</div>`;
  }

  /* ---------- helpers ---------- */
  function labelHead(t) { return (t || "").split(" · ").slice(0, 2).join(" · ") || "cluster"; }
  function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function num(x) { return (x === null || x === undefined || Number.isNaN(x)) ? "—" : (+x).toFixed(2); }
  function pct(x) { return (x === null || x === undefined || Number.isNaN(x)) ? "—" : (100 * x).toFixed(0) + "%"; }
  function fmtInt(x) { return (x ?? 0).toLocaleString("es-AR"); }

  // Cronograma sintético a partir de la secuencia modal (para las tarjetas de la
  // muestra de ejemplo, que no traen el tensor real).
  function synthChrono(modal) {
    const toks = (modal || "F-F-F-F-F-F-F-F-F-F-F-F-F-F-F-F-F-F-F-F-F-F-F").split("-");
    return toks.map((tk, t) => {
      const row = new Array(VOCAB.length).fill(0);
      const id = Math.max(0, VOCAB.indexOf(tk));
      const blur = 0.12 + 0.05 * Math.sin(t);
      row[id] = 1 - blur;
      const prev = Math.max(0, VOCAB.indexOf(toks[Math.max(0, t - 1)]));
      const nxt = Math.max(0, VOCAB.indexOf(toks[Math.min(toks.length - 1, t + 1)]));
      row[prev] += blur / 2; row[nxt] += blur / 2;
      const sum = row.reduce((a, b) => a + b, 0);
      return row.map((v) => v / sum);
    });
  }

    // sec([[6,"Sh"],[17,"A"]]) -> "Sh-Sh-Sh-Sh-Sh-Sh-A-...-A" (23 tokens)

      runs: [

          clusters: [
            mk(0, 12698, 0.16, "F»Wt · monotónica · ~2004 · anegamiento de bosque", "monotónica", 2004, "anegamiento de bosque", S(3, "Wt")),
            mk(1, 5895, 0.075, "B»Sp · monotónica · ~2019 · revegetación de suelo desnudo", "monotónica", 2019, "revegetación de suelo desnudo", sec([[19, "B"], [4, "Sp"]])),
            mk(2, 3810, 0.05, "Sh»A · monotónica · ~2006 · habilitación de arbustal para agricultura", "monotónica", 2006, "habilitación de arbustal para agricultura", sec([[6, "Sh"], [17, "A"]])),
            mk(3, 2648, 0.035, "F»A · monotónica · ~2008 · deforestación para agricultura", "monotónica", 2008, "deforestación para agricultura", S(8, "A")),
            mk(4, 2183, 0.028, "Wt»F · monotónica · ~2010 · humedal a bosque", "monotónica", 2010, "humedal a bosque", sec([[10, "Wt"], [13, "F"]])),
            mk(5, 1396, 0.018, "A»Sh»A · oscilante · ~2011 · abandono agrícola con arbustización", "oscilante", 2011, "abandono agrícola con arbustización", sec([[8, "A"], [6, "Sh"], [9, "A"]]))
          ]
        },
        {
          name: "gruesa / HDBSCAN", suffix: "_coarse", k: 4, algo: "hdbscan", space: "l2",
          noise_frac: 0.20, top1_coverage_weighted: 0.38,
          seqdist: { metodo: "om", pseudo_r2: 0.48, asw_secuencias: 0.22 },
          metrics: { silhouette_mean: 0.58, stability_ari: 0.72, prototype_fidelity: 0.74 },
          clusters: [
            mk(0, 21400, 0.28, "F»Wt · monotónica · ~2005 · anegamiento de bosque", "monotónica", 2005, "anegamiento de bosque", S(4, "Wt")),
            mk(1, 14880, 0.19, "F»A · monotónica · ~2009 · deforestación para agricultura", "monotónica", 2009, "deforestación para agricultura", S(9, "A")),
            mk(2, 9200, 0.12, "B»Sp · monotónica · ~2018 · revegetación de suelo desnudo", "monotónica", 2018, "revegetación de suelo desnudo", sec([[18, "B"], [5, "Sp"]])),
            mk(3, 5100, 0.066, "Sh»F · monotónica · ~2012 · recuperación forestal desde arbustal", "monotónica", 2012, "recuperación forestal desde arbustal", sec([[12, "Sh"], [11, "F"]]))

    };
  }
