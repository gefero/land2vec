name: Deploy typology browser to GitHub Pages

# Publica docs/typology/ (el navegador de tipologías -- ver
# docs/typology/README.md). El JSON de datos lo genera
# scripts/describe_clusters.py en local y se commitea; este workflow solo
# sube el directorio como sitio estático.

on:
  push:
    branches: [main]
    paths:
      - "docs/typology/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/typology
      - id: deployment
        uses: actions/deploy-pages@v4
